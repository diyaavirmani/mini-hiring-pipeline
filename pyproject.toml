[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hiring-pipeline"
version = "0.1.0"
description = "A focused candidate pipeline for one recruiter and one job."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "itsdangerous>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0"]
docs = ["reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hiring_pipeline = ["static/*"]
