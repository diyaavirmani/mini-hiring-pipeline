[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hiring-pipeline"
version = "0.1.0"
description = "A focused candidate pipeline for one recruiter and one job."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
